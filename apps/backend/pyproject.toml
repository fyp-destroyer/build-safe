[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
# pytest-asyncio in auto mode: async tests and async fixtures are picked up
# without per-test markers. NOTE: the previous setting here was
# `anyio_mode = "auto"`, which is not a real option - anyio's plugin has no
# such key, so it was silently ignored. Under pytest 9 that left async
# fixtures unhandled and every test in the suite errored at collection.
asyncio_mode = "auto"
# Fixtures AND tests must share one loop. conftest builds the async engine at
# module import and the schema fixture is session-scoped, so per-function
# loops (the default) leave asyncpg connections bound to a dead loop and
# every DB test fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
