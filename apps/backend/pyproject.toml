[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
# anyio ships its own pytest plugin (no pytest-asyncio dependency needed);
# restrict to asyncio since that's all we use.
anyio_mode = "auto"
